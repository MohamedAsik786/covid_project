function makeCases() {
  const rows = [];
  const start = new Date('2020-03-01');
  for (let i = 0; i < 150; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i * 8);
    const t = i / 149;
    const w1 = 50000 * Math.exp(-Math.pow(t - 0.25, 2) / 0.01);
    const w2 = 120000 * Math.exp(-Math.pow(t - 0.55, 2) / 0.008);
    const w3 = 80000 * Math.exp(-Math.pow(t - 0.78, 2) / 0.006);
    const cases = Math.max(500, w1 + w2 + w3 + (Math.random() - 0.5) * 5000);
    rows.push({
      date: d.toISOString().slice(0,10),
      new_cases_daily: Math.round(cases),
      rolling_7day_avg: Math.round(cases * 0.94),
      deaths: Math.round(cases * 0.018),
      confirmed_cases: Math.round(cases * 120),
      growth_rate: (Math.random() - 0.4) * 0.3
    });
  }
  return rows;
}

function makePreds() {
  const rows = [];
  const start = new Date(); start.setDate(start.getDate() + 1);
  let base = 12000;
  for (let i = 0; i < 30; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    base = Math.max(500, base + (Math.random() - 0.52) * 800);
    rows.push({
      date: d.toISOString().slice(0,10),
      predicted_cases: Math.round(base),
      lower_bound: Math.round(base * 0.80),
      upper_bound: Math.round(base * 1.20),
      day: i + 1
    });
  }
  return rows;
}

// ─── Utils ─────────────────────────────────────────────────────────────────
const fmt = n => {
  if (n == null) return '0';
  n = Number(n);
  if (n >= 1e7) return (n/1e7).toFixed(1)+' Cr';
  if (n >= 1e5) return (n/1e5).toFixed(1)+' L';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString();
};

const badgeClass = lvl => ({CRITICAL:'bc',HIGH:'bh',MEDIUM:'bm',LOW:'bl'}[lvl]||'bl');
const occColor = v => v >= 0.95 ? '#8e44ad' : v >= 0.80 ? '#e74c3c' : v >= 0.60 ? '#f39c12' : '#27ae60';

// ─── Mini chart engine (canvas-based, no external lib needed) ──────────────
function drawAreaChart(canvasId, datasets, labels, height=220) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  canvas.height = height;
  canvas.width = canvas.parentElement.clientWidth || 600;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = {top:20, right:20, bottom:40, left:60};
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);

  if (!datasets.length || !datasets[0].data.length) return;

  const allVals = datasets.flatMap(d => d.data);
  const maxVal = Math.max(...allVals) * 1.1 || 1;
  const minVal = 0;

  const xScale = i => pad.left + (i / (datasets[0].data.length - 1)) * cW;
  const yScale = v => pad.top + cH - ((v - minVal) / (maxVal - minVal)) * cH;

  // Grid lines
  ctx.strokeStyle = '#1e2a5e'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (cH / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cW, y); ctx.stroke();
    const val = maxVal - (maxVal / 4) * i;
    ctx.fillStyle = '#5a6a8a'; ctx.font = '10px Segoe UI'; ctx.textAlign = 'right';
    ctx.fillText(fmt(val), pad.left - 4, y + 4);
  }

  // X axis labels (every ~15 points)
  ctx.fillStyle = '#5a6a8a'; ctx.textAlign = 'center'; ctx.font = '10px Segoe UI';
  const step = Math.max(1, Math.floor(labels.length / 8));
  for (let i = 0; i < labels.length; i += step) {
    ctx.fillText(labels[i].slice(2,10), xScale(i), pad.top + cH + 18);
  }

  // Draw each dataset
  datasets.forEach(ds => {
    const data = ds.data;
    // Area fill
    const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + cH);
    grad.addColorStop(0, ds.color + '55');
    grad.addColorStop(1, ds.color + '00');

    ctx.beginPath();
    ctx.moveTo(xScale(0), yScale(data[0]));
    for (let i = 1; i < data.length; i++) ctx.lineTo(xScale(i), yScale(data[i]));
    ctx.lineTo(xScale(data.length - 1), pad.top + cH);
    ctx.lineTo(xScale(0), pad.top + cH);
    ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    // Line
    ctx.beginPath();
    ctx.moveTo(xScale(0), yScale(data[0]));
    for (let i = 1; i < data.length; i++) ctx.lineTo(xScale(i), yScale(data[i]));
    ctx.strokeStyle = ds.color; ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round'; ctx.stroke();
  });

  // Legend
  let lx = pad.left;
  datasets.forEach(ds => {
    ctx.fillStyle = ds.color; ctx.fillRect(lx, 5, 12, 8);
    ctx.fillStyle = '#a0b4d6'; ctx.font = '10px Segoe UI'; ctx.textAlign = 'left';
    ctx.fillText(ds.label, lx + 16, 13);
    lx += ctx.measureText(ds.label).width + 32;
  });
}

function drawBarChart(canvasId, labels, values, colors, height=220) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  canvas.height = height;
  canvas.width = canvas.parentElement.clientWidth || 600;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = {top:20, right:20, bottom:60, left:70};
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  const maxVal = Math.max(...values) * 1.1 || 1;
  const barW = Math.max(8, (cW / labels.length) * 0.6);
  const gap = cW / labels.length;

  // Grid
  ctx.strokeStyle = '#1e2a5e'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (cH / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cW, y); ctx.stroke();
    ctx.fillStyle = '#5a6a8a'; ctx.font = '10px Segoe UI'; ctx.textAlign = 'right';
    ctx.fillText(fmt(maxVal - (maxVal / 4) * i), pad.left - 4, y + 4);
  }

  // Bars
  labels.forEach((lbl, i) => {
    const x = pad.left + gap * i + (gap - barW) / 2;
    const barH = (values[i] / maxVal) * cH;
    const y = pad.top + cH - barH;
    const color = Array.isArray(colors) ? (colors[i] || colors[0]) : colors;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, barW, barH, [4,4,0,0]) : ctx.rect(x, y, barW, barH);
    ctx.fill();
    ctx.fillStyle = '#5a6a8a'; ctx.font = '10px Segoe UI'; ctx.textAlign = 'center';
    ctx.save(); ctx.translate(x + barW/2, pad.top + cH + 14); ctx.rotate(-0.4);
    ctx.fillText(lbl.slice(0,12), 0, 0); ctx.restore();
  });
}

function drawPieChart(canvasId, labels, values, colors, height=220) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  canvas.height = height;
  canvas.width = canvas.parentElement.clientWidth || 400;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const total = values.reduce((a,b) => a + b, 0);
  const cx = W * 0.4, cy = H / 2;
  const r = Math.min(cx, cy) * 0.75;
  let startAngle = -Math.PI / 2;

  values.forEach((v, i) => {
    const slice = (v / total) * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, startAngle + slice);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length]; ctx.fill();
    ctx.strokeStyle = '#0a0e27'; ctx.lineWidth = 2; ctx.stroke();
    startAngle += slice;
  });

  // Legend
  const lx = W * 0.82, ly0 = 20;
  labels.forEach((lbl, i) => {
    const ly = ly0 + i * 22;
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(lx - 45, ly, 12, 12);
    ctx.fillStyle = '#a0b4d6'; ctx.font = '11px Segoe UI'; ctx.textAlign = 'left';
    ctx.fillText(lbl.slice(0,12), lx - 30, ly + 11);
    const pct = ((v/total)*100).toFixed(0)+'%';
    const v = values[i];
    ctx.fillStyle = '#5a6a8a';
    ctx.fillText(pct, lx - 30 + ctx.measureText(lbl.slice(0,12)).width + 4, ly + 11);
  });
}

  ];

  const rows = (d.top_risk_states||[]).map(s => `
    <tr>
      <td style="font-weight:600">${s.state}</td>

  document.getElementById('app').innerHTML = `
    <div class="page-title">COVID-19 Analytics Dashboard</div>
    <div class="kpi-grid">

          <div class="kpi-sub">${sub}</div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="card-title">Top Risk States — Current Status</div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>State</th><th>Risk Score</th><th>Level</th><th>Avg Daily Cases</th><th>CFR%</th><th>Risk Meter</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">India Summary</div>
        <div class="kpi-grid" style="grid-template-columns:1fr 1fr">
          <div class="kpi-card"><div class="kpi-label">India Confirmed</div><div class="kpi-value" style="color:#00d4ff">${fmt(s.india_confirmed)}</div></div>
          <div class="kpi-card"><div class="kpi-label">India Deaths</div><div class="kpi-value" style="color:#ff4757">${fmt(s.india_deaths)}</div></div>
          <div class="kpi-card"><div class="kpi-label">ICU Admissions</div><div class="kpi-value" style="color:#ffa502">${fmt(s.icu_admissions)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Patients Tracked</div><div class="kpi-value" style="color:#7bed9f">${fmt(s.total_patients)}</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Alert Summary</div>
        ${['CRITICAL','HIGH','MEDIUM','LOW'].map(lvl=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1a2240">
            <span class="rbadge ${riskClass(lvl)}">${lvl}</span>
            <div class="pbar" style="flex:1;margin:0 12px">
              <div class="pfill" style="width:${Math.min(100,(al.by_level?.[lvl]||0)/al.total*100)}%;background:${riskColor(lvl)}"></div>
            </div>
            <span style="color:#a0b4d6;font-weight:700;min-width:24px;text-align:right">${al.by_level?.[lvl]||0}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

async function renderCases() {
  let d = await api('/api/cases?limit=150');
  const rows = (d && d.data) ? d.data : MOCK.cases;

  document.getElementById('app').innerHTML = `
    <div class="page-title">COVID-19 Case Trends (2020–2023)</div>
    <div style="font-size:.78rem;color:#5a6a8a;margin-bottom:14px">Wave 1: Sep 2020 &nbsp;|&nbsp; Wave 2: May 2021 &nbsp;|&nbsp; Wave 3: Jan 2022</div>
    <div class="card">
      <div class="card-title">Daily New Cases — Wave Patterns</div>
      <canvas id="casesChart"></canvas>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">Daily Deaths Over Time</div>
      <canvas id="deathsChart" style="margin-top:8px"></canvas>
    </div>`;

  const labels = rows.map(r=>r.date);
  drawAreaChart('casesChart', [
    {label:'Daily Cases', data:rows.map(r=>r.new_cases_daily||0), color:'#00d4ff'},
    {label:'7-Day Avg',   data:rows.map(r=>r.rolling_7day_avg||0), color:'#ffa502'},

  drawAreaChart('deathsChart', [

async function renderPrediction() {
  let d = await api('/api/predict');
  let preds, model;
  if (d && d.data) { preds = d.data.predictions; model = d.data.model; }
  else { preds = MOCK.predictions.predictions; model = MOCK.predictions.model; }

  const weekly = [0,1,2,3].map(w => {
    const s=preds[w*7], e=preds[Math.min(w*7+6,preds.length-1)];
    if(!s||!e) return '';
    const avg = Math.round((s.predicted_cases+e.predicted_cases)/2);
    const trend = e.predicted_cases > s.predicted_cases;
    return `<tr>
      <td>Week ${w+1}</td><td>${s.date?.slice(5)} – ${e.date?.slice(5)}</td>
      <td style="color:#7bed9f;font-weight:600">${avg.toLocaleString()}</td>
      <td style="color:#5a6a8a">${s.lower_bound?.toLocaleString()}</td>
      <td style="color:#5a6a8a">${e.upper_bound?.toLocaleString()}</td>
      <td>${trend?'Rising':'Falling'}</td>
    </tr>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="page-title">30-Day Outbreak Prediction</div>
    <div style="font-size:.78rem;color:#7a8cad;margin-bottom:14px;background:#0d1230;padding:6px 12px;border-radius:8px;border:1px solid #1e2a5e;display:inline-block">
      Model: ${model} &nbsp;|&nbsp; Confidence: 80%
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-title">Predicted Daily Cases — Next 30 Days</div>
      <canvas id="predChart"></canvas>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">Weekly Prediction Summary</div>
      <table><thead><tr><th>Week</th><th>Date Range</th><th>Avg Predicted</th><th>Lower</th><th>Upper</th><th>Trend</th></tr></thead>
      <tbody>${weekly}</tbody></table>
    </div>`;

  drawAreaChart('predChart', [
    {label:'Predicted Cases', data:preds.map(p=>p.predicted_cases||0), color:'#7bed9f'},
    {label:'Upper CI',        data:preds.map(p=>p.upper_bound||0),     color:'#00d4ff'},
    {label:'Lower CI',        data:preds.map(p=>p.lower_bound||0),     color:'#a29bfe'},
  ], preds.map(p=>p.date), 280);
}

async function renderAlerts() {
  let d = await api('/api/alerts');
  const allAlerts = (d && d.data) ? d.data : MOCK.alerts.data;
  let filter = 'ALL';

  function render(f) {
    const shown = f === 'ALL' ? allAlerts : allAlerts.filter(a=>a.level===f);
    const cnt = allAlerts.reduce((a,x)=>{a[x.level]=(a[x.level]||0)+1;return a;},{});
    const btns = [['ALL','#00d4ff',allAlerts.length],['CRITICAL','#8e44ad',cnt.CRITICAL||0],
      ['HIGH','#e74c3c',cnt.HIGH||0],['MEDIUM','#f39c12',cnt.MEDIUM||0],['LOW','#27ae60',cnt.LOW||0]];

    document.getElementById('app').innerHTML = `
      <div class="page-title">Early Warning Alerts</div>
      <div class="filter-bar">
        ${btns.map(([lvl,col,count])=>`
          <button class="filt-btn" onclick="window._alertFilter('${lvl}')"
            style="${f===lvl?`background:${col}33;border-color:${col};color:${col}`:''}"
          >${lvl} (${count})</button>`).join('')}
      </div>
      ${shown.map(a=>`
        <div class="alert-item ${alertClass(a.level)}">
          <div class="at"><span class="badge ${badgeClass(a.level)}">${a.level}</span>${a.title}</div>
          <div class="am">${a.message}</div>
          <div class="ameta">${a.region} &nbsp;|&nbsp; ${a.metric}: ${typeof a.value==='number'?a.value.toLocaleString():a.value} &nbsp;|&nbsp; ${a.timestamp}</div>
        </div>`).join('')}
      ${shown.length===0?'<div style="text-align:center;padding:40px;color:#5a6a8a">No alerts for this filter.</div>':''}`;
  }

  window._alertFilter = (f) => { filter = f; render(f); };
  render(filter);
}

async function renderRisk() {
  let d = await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'risk_scores'})}).then(r=>r.json()).catch(()=>null);
  const scores = (d && d.data && d.data.length) ? d.data : MOCK.risk.data;
  let selected = scores[0];

  function render() {
    document.getElementById('app').innerHTML = `
      <div class="page-title">Regional Risk Scores</div>
      <div class="grid2">
        <div class="card">
          <div class="card-title">All States — Risk Overview</div>
          ${scores.map((s,i)=>`
            <div onclick="window._selRisk(${i})" style="padding:11px 13px;border-radius:10px;cursor:pointer;margin-bottom:8px;
              background:${selected.state===s.state?'#1e2a5e':'#111730'};
              border:1px solid ${selected.state===s.state?riskColor(s.risk_level):'#1e2a5e'};transition:all .2s">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="font-weight:600">${s.state}</span>
                <span class="rbadge ${riskClass(s.risk_level)}">${s.risk_level}</span>
              </div>
              <div class="pbar"><div class="pfill" style="width:${s.risk_score}%;background:${riskColor(s.risk_level)}"></div></div>
              <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:.7rem;color:#5a6a8a">
                <span>Score: ${s.risk_score}</span><span>CFR: ${Number(s.avg_cfr||0).toFixed(2)}%</span>
              </div>
            </div>`).join('')}
        </div>
        <div>
          <div class="card">
            <div class="card-title">${selected.state} — Risk Detail</div>
            <div style="text-align:center;padding:20px 0">
              <div style="font-size:4rem;font-weight:900;color:${riskColor(selected.risk_level)}">${selected.risk_score}</div>
              <div style="color:#a0b4d6;margin-bottom:14px">Risk Score / 100</div>
              <span class="rbadge ${riskClass(selected.risk_level)}" style="font-size:.85rem;padding:5px 14px">${selected.risk_level} RISK</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
              <div style="background:#111730;padding:12px;border-radius:8px">
                <div style="font-size:.7rem;color:#5a6a8a;margin-bottom:4px">Avg Daily Cases</div>
                <div style="font-weight:700">${Math.round(selected.avg_new_cases||0).toLocaleString()}</div>
              </div>
              <div style="background:#111730;padding:12px;border-radius:8px">
                <div style="font-size:.7rem;color:#5a6a8a;margin-bottom:4px">Case Fatality Rate</div>
                <div style="font-weight:700">${Number(selected.avg_cfr||0).toFixed(2)}%</div>
              </div>
            </div>
          </div>
          <div class="card" style="margin-top:16px">
            <div class="card-title">Risk Distribution — All States</div>
            <canvas id="riskChart"></canvas>
          </div>
        </div>
      </div>`;

    drawBarChart('riskChart',
      scores.map(s=>s.state.slice(0,10)),
      scores.map(s=>s.risk_score),
      scores.map(s=>riskColor(s.risk_level)), 220);
  }

  window._selRisk = (i) => { selected = scores[i]; render(); };
  render();
}

// ─── Tab routing ───────────────────────────────────────────────────────────
const TABS = [
  {id:'dashboard',  label:'Dashboard',   fn:renderDashboard},
  {id:'cases',      label:'Cases',       fn:renderCases},
  {id:'prediction', label:'Prediction',  fn:renderPrediction},
  {id:'alerts',     label:'Alerts',      fn:renderAlerts},
  {id:'hospital',   label:'Hospital',    fn:renderHospital},
  {id:'vaccination',label:'Vaccination', fn:renderVaccination},
  {id:'risk',       label:'Risk Scores', fn:renderRisk},
];

let currentTab = 'dashboard';

function setTab(id) {
  currentTab = id;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === id);
  });
  TABS.find(t=>t.id===id)?.fn();
}

// ─── Boot ──────────────────────────────────────────────────────────────────
async function boot() {
  // Build nav
  document.getElementById('navLinks').innerHTML = TABS.map(t =>
    `<button class="nav-btn${t.id==='dashboard'?' active':''}" data-tab="${t.id}" onclick="setTab('${t.id}')">${t.label}</button>`
  ).join('');

  // Check backend
  const h = await api('/api/health');
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (h && h.status === 'healthy') {
    dot.className = 'dot dg';
    txt.textContent = 'Backend: Connected (localhost:5000) — Live data';
  } else {
    dot.className = 'dot dy';
    txt.textContent = 'Backend: Offline — Showing built-in demo data';
  }

  // Hide loading
  document.getElementById('loading').style.display = 'none';

  // Render default tab
  await renderDashboard();
}

boot();
</script>
